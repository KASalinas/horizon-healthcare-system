spring.application.name=horizon-healthcare
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/horizon}
spring.datasource.username=${DB_USERNAME:horizon}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=${DB_BASELINE_ON_MIGRATE:false}
springdoc.swagger-ui.path=/docs
